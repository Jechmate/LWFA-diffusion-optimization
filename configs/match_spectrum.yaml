# Configuration for optimize_match_spectrum.py
#
#   python optimize_match_spectrum.py --config configs/match_spectrum.yaml
#
# Every value here has a built-in default in the script, so a config may define
# only the keys it wants to change. Command line flags (--mode, --device, ...)
# override whatever is set here.

model_path: models/edm_4kepochs/ema_ckpt_final.pt
target_spectrum_csv: avg_spectrum_45_25_20.csv
device: cuda:1          # falls back to cpu when CUDA is unavailable

run:
  mode: comparison      # comparison | multi | extend
  output: null          # null -> auto timestamped directory
  approach: bayes_adam  # multi mode: which approach to run
  # comparison/extend mode: which approaches to run. null -> every approach
  # defined below. The default is the set compared in the paper.
  approaches: [bayesian_only, adam_only, lbfgs_only,
               bayes_adam, bayes_lbfgs, adam_lbfgs,
               bayes_adam_lbfgs, bayes_lbfgs_adam]
  n_seeds: 10           # multi mode: how many seeds to draw
  multi_seed_base: 42   # multi mode: RNG seed used to draw those seeds
  comparison_seeds: [67, 156, 236, 391, 429, 504, 742, 782, 823, 918]
  real_vs_generated: false  # comparison mode: also plot real target vs generated (needs intensity_std in target CSV)

# Passed straight to SpectrumMatchingOptimizer.
optimizer:
  laser_energy_bounds: [5.0, 50.0]
  pressure_bounds: [1.0, 50.0]
  acquisition_time_bounds: [5.0, 100.0]
  batch_size: 16
  spectrum_length: 256
  features: ["E", "P", "ms"]
  num_sampling_steps: 18
  sigma_min: 0.002
  sigma_max: 80
  rho: 7
  cfg_scale: 3.0
  smooth_output: true
  smooth_kernel_size: 9
  smooth_sigma: 2.0
  normalize_spectrum: false
  # Objective: 'mse' matches target_spectrum_csv; 'beam_energy' maximizes
  # int I(E) E^p dE (charge x energy) and 'mean_energy' maximizes
  # int I E^p dE / int I dE (energy per unit charge). Both ignore the target's
  # intensities but still take the energy axis from that CSV.
  objective: mse
  energy_power: 1.0
  energy_min: 0.0

# Each approach is a list of stages run in order. The first stage starts from
# random parameters; every later stage starts from the best parameters found so
# far, and the reported result is the best stage overall.
#
# method: bayesian -> n_calls, n_initial
#         adam     -> n_steps, lr
#         lbfgs    -> n_steps, lr
#         sgd      -> n_steps, lr, momentum
#         langevin -> n_steps, lr, noise_scale, decay_power
#                     (SGLD; noise_scale = sqrt(temperature), 1.0 = canonical,
#                      0 = plain SGD; eps_t = lr / (1 + step)**decay_power)
#         bayesian_prior -> n_calls, n_initial, prior_npz (3D loss cube .npz from
#                           plot_loss_landscape.py; null = flat prior, matched baseline)
approaches:
  bayesian_only:
    label: Bayesian Only
    stages:
      - {method: bayesian, n_calls: 100, n_initial: 10}

  adam_only:
    label: Adam Only
    stages:
      - {method: adam, n_steps: 100, lr: 2.0}

  lbfgs_only:
    label: LBFGS Only
    stages:
      - {method: lbfgs, n_steps: 100, lr: 2.0}

  bayes_adam:
    label: Bayes + Adam
    stages:
      - {method: bayesian, n_calls: 100, n_initial: 10}
      - {method: adam, n_steps: 50, lr: 2.0}

  bayes_lbfgs:
    label: Bayes + LBFGS
    stages:
      - {method: bayesian, n_calls: 100, n_initial: 10}
      - {method: lbfgs, n_steps: 50, lr: 2.0}

  adam_lbfgs:
    label: Adam + LBFGS
    stages:
      - {method: adam, n_steps: 50, lr: 2.0}
      - {method: lbfgs, n_steps: 50, lr: 2.0}

  bayes_adam_lbfgs:
    label: Bayes + Adam + LBFGS
    stages:
      - {method: bayesian, n_calls: 100, n_initial: 10}
      - {method: adam, n_steps: 50, lr: 2.0}
      - {method: lbfgs, n_steps: 50, lr: 2.0}

  bayes_lbfgs_adam:
    label: Bayes + LBFGS + Adam
    stages:
      - {method: bayesian, n_calls: 100, n_initial: 10}
      - {method: lbfgs, n_steps: 50, lr: 2.0}
      - {method: adam, n_steps: 50, lr: 2.0}

  bayes_sgd:
    label: Bayes + SGD
    stages:
      - {method: bayesian, n_calls: 100, n_initial: 10}
      - {method: sgd, n_steps: 50, lr: 2.0, momentum: 0.9}

  bayes_lbfgs_langevin:
    label: Bayes + LBFGS + Langevin
    stages:
      - {method: bayesian, n_calls: 100, n_initial: 10}
      - {method: lbfgs, n_steps: 50, lr: 2.0}
      - {method: langevin, n_steps: 50, lr: 2.0, noise_scale: 1.0, decay_power: 0.5}

  bayes_langevin_lbfgs:
    label: Bayes + Langevin + LBFGS
    stages:
      - {method: bayesian, n_calls: 100, n_initial: 10}
      - {method: langevin, n_steps: 50, lr: 2.0, noise_scale: 1.0, decay_power: 0.5}
      - {method: lbfgs, n_steps: 50, lr: 2.0}

  bayes_prior_only:
    label: Bayes (surrogate prior)
    stages:
      - {method: bayesian_prior, n_calls: 100, n_initial: 10, prior_npz: loss_landscape_bounds.npz}

  bayes_prior_lbfgs_adam:
    label: Bayes(prior) + LBFGS + Adam
    stages:
      - {method: bayesian_prior, n_calls: 100, n_initial: 10, prior_npz: loss_landscape_bounds.npz}
      - {method: lbfgs, n_steps: 50, lr: 2.0}
      - {method: adam, n_steps: 50, lr: 2.0}

  bayes_prior_adam_lbfgs:
    label: Bayes(prior) + Adam + LBFGS
    stages:
      - {method: bayesian_prior, n_calls: 100, n_initial: 10, prior_npz: loss_landscape_bounds.npz}
      - {method: adam, n_steps: 50, lr: 2.0}
      - {method: lbfgs, n_steps: 50, lr: 2.0}
